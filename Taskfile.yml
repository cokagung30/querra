version: '3'

# Local test database settings for db:reset and test:integration (optional;
# see dev/test.env.example).
dotenv: ['dev/test.env']

vars:
  APP_NAME: "querra"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  GOLANGCI_LINT_VERSION: v2.15.0
  DB_ENGINES: postgres mysql mariadb

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  bindings:
    summary: Regenerates frontend/bindings from the Go services
    cmds:
      - task: common:generate:bindings

  lint:
    summary: Runs golangci-lint, ESLint, Prettier and the TypeScript compiler
    cmds:
      # main.go embeds frontend/dist, so Go tooling needs a frontend build first.
      - task: common:build:frontend
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run
      - task: lint:frontend

  lint:frontend:
    summary: Runs ESLint, Prettier and the TypeScript compiler on the frontend
    dir: frontend
    cmds:
      - npm run lint
      - npm run format:check
      - npm run typecheck

  test:
    summary: Runs Go unit tests and frontend tests
    cmds:
      - task: common:build:frontend
      - go test ./...
      - task: test:frontend

  test:frontend:
    summary: Runs frontend tests (Vitest)
    dir: frontend
    cmds:
      - npm run test

  test:integration:
    summary: Runs Go integration tests against the databases prepared by `db:reset`
    cmds:
      # Tests read the QUERRA_DEV_* settings from dev/test.env and skip engines
      # whose HOST is empty.
      - task: common:build:frontend
      - go test -tags=integration ./...

  db:reset:
    summary: Recreates and seeds the querra_test databases on your local servers (dev/test.env)
    cmds:
      - for:
          var: DB_ENGINES
        cmd: bash dev/testdb.sh reset {{.ITEM}}

  db:drop:
    summary: Drops the querra_test databases and user from your local servers
    cmds:
      - for:
          var: DB_ENGINES
        cmd: bash dev/testdb.sh drop {{.ITEM}}
