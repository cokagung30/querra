name: Perf measurements

# Manual only (Actions → Perf measurements → Run workflow). Builds the Windows
# app and NSIS installer, then runs the startup, memory and grid measurements in
# dev/perf/measure_windows.ps1. GitHub's Windows runners are VMs without a GPU,
# so WebView2 renders in software: treat frame rates as a pessimistic lower
# bound, and startup and memory as indicative.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI (version pinned in go.mod)
        shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Install NSIS if missing
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build app and installer
        shell: bash
        run: wails3 task package

      - name: Measure
        shell: pwsh
        env:
          # Keep WebView2 animating even if the runner's desktop reports the
          # window as occluded.
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: >-
            --disable-features=CalculateNativeWinOcclusion
            --disable-renderer-backgrounding
            --disable-background-timer-throttling
        run: |
          $json = ./dev/perf/measure_windows.ps1 -Exe bin/querra.exe
          $json | Set-Content perf-windows.json
          "## Windows perf measurements`n" + '```json' + "`n$json`n" + '```' |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: perf-windows
          path: perf-windows.json
